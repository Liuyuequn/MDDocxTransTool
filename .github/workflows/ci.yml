name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 测试（${{ matrix.os }} / Node ${{ matrix.node }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 安装依赖
        run: npm ci
      - name: 运行测试（单元 + 端到端 + Open XML Schema）
        run: npm test
